<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- The page needs nothing from the network, so it is forbidden from asking:
         default-src 'none' blocks every resource type not named below, and
         connect-src 'none' leaves fetch / XHR / WebSocket / EventSource with
         nowhere to go. Scripts and styles come from this page's own origin only,
         with no inline script allowed - which is why the bootstrap lives in
         boot.js and boot-scripts.js instead of inline blocks. Holds for both
         origins this page runs under: the app's 127.0.0.1 asset server, and a
         file:// page in the no-bridge browser preview.

         'unsafe-eval' is there for the host's own bridge, never for this page's
         code: pywebview builds each window.pywebview.api.* method with
         new Function(), and hands every return value back through an eval().
         WebView2 exempts host-injected script from the page policy, WebKitGTK
         does not - so without it the whole bridge silently fails to appear on
         Linux and nothing ever loads. It permits code generation; it does not
         admit a single new script source, and no application code here calls
         eval, new Function, or a string-bodied timer. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none';
        script-src 'self' 'unsafe-eval'; style-src 'self'; img-src 'self';
        connect-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Agent Monitor for Claude</title>
    <script src="boot.js"></script>
</head>
<body>
    <header class="toolbar" id="toolbar">
        <div class="search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.4-3.4"></path>
            </svg>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false">
            <div class="search-opts">
                <button id="opt-case" class="search-opt" type="button" aria-pressed="false">Aa</button>
                <button id="opt-word" class="search-opt search-opt-word" type="button" aria-pressed="false">ab</button>
                <button id="opt-regex" class="search-opt" type="button" aria-pressed="false">.*</button>
            </div>
            <kbd id="search-key" class="search-key"></kbd>
        </div>
        <div class="group-switch" id="group-switch" role="radiogroup">
            <button type="button" role="radio" data-group="urgency"></button>
            <button type="button" role="radio" data-group="project"></button>
            <button type="button" role="radio" data-group="graph"></button>
        </div>
        <span class="toolbar-gap"></span>
        <span class="toolbar-summary" id="toolbar-summary"></span>
        <button id="compact-toggle" class="tool-btn" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="7" y="3" width="10" height="18" rx="2"></rect>
                <path d="M10 7h4M10 11h4M10 15h4"></path>
            </svg>
            <span class="tool-label"></span>
        </button>
        <div class="search-progress" id="search-progress" role="progressbar" hidden>
            <div class="search-progress-fill"></div>
        </div>
    </header>
    <div class="workspace" id="workspace">
        <main id="content" class="content" tabindex="-1"></main>
        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
        <section id="detail" class="detail"></section>
    </div>
    <script src="boot-scripts.js"></script>
</body>
</html>
