name: Release

# Builds the standalone EXE on a GitHub-hosted runner and has it code signed by
# SignPath.io. The build must happen here, not locally: SignPath only signs
# artifacts whose origin metadata comes from a trusted build system.
#
# Push a version tag (v0.5.0) to build, sign with the release policy and publish
# a draft GitHub release. Run it manually to rehearse the whole chain against the
# test certificate without publishing anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      signing-policy:
        description: 'SignPath signing policy ("none" builds unsigned)'
        type: choice
        options:
          - test-signing
          - release-signing
          - none
        default: test-signing

env:
  SIGNPATH_PROJECT_SLUG: agent-monitor-for-claude
  # Slug of the artifact configuration in SignPath (Project -> Artifact
  # Configurations). Its root element must be <zip-file>, because
  # actions/upload-artifact wraps the EXE in a ZIP archive.
  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: initial
  # The production certificate has not been issued yet, so a tag currently builds
  # unsigned. Change this back to 'release-signing' once the certificate is there.
  SIGNING_POLICY: ${{ inputs.signing-policy || 'none' }}

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the Python test suite
        run: python -m unittest discover -s tests

      - name: Run the UI logic test suite
        run: node --test tests/js/logic.test.js tests/js/global-scope.test.js

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = python -c "import agent_monitor_for_claude; print(agent_monitor_for_claude.__version__)"
          if ($tag -ne $version) {
            throw "Tag $tag does not match __version__ $version"
          }
          Write-Host "Version $version matches tag ${{ github.ref_name }}"

      - name: Build the standalone EXE
        run: python build.py

      - name: Verify the EXE file version
        shell: pwsh
        run: |
          $info = (Get-Item dist/AgentMonitorForClaude.exe).VersionInfo
          Write-Host "FileVersion: $($info.FileVersion)"
          $version = python -c "import agent_monitor_for_claude; print(agent_monitor_for_claude.__version__)"
          if ($info.FileVersion -notlike "$version*") {
            throw "FileVersion $($info.FileVersion) does not match __version__ $version - update version_info.py"
          }

      - name: Upload the unsigned EXE
        id: unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentMonitorForClaude-unsigned
          path: dist/AgentMonitorForClaude.exe
          if-no-files-found: error

      - name: Submit the signing request to SignPath
        if: env.SIGNING_POLICY != 'none'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          # The release policy requires a manual approval in the SignPath UI, and
          # the action's default of 10 minutes is too short to walk over and give
          # it. A timeout fails the run before anything is published.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Locate and verify the signed EXE
        id: signed-exe
        if: env.SIGNING_POLICY != 'none'
        shell: pwsh
        run: |
          # The signed artifact comes back the way it went in - as a ZIP, unless
          # SignPath already unpacked it. Handle both without guessing.
          Get-ChildItem -Path signed -Recurse -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath signed -Force
          }
          $exe = Get-ChildItem -Path signed -Recurse -Filter AgentMonitorForClaude.exe | Select-Object -First 1
          if (-not $exe) {
            throw 'No signed AgentMonitorForClaude.exe found below signed/'
          }
          $signature = Get-AuthenticodeSignature -FilePath $exe.FullName
          Write-Host "Status:  $($signature.Status)"
          Write-Host "Subject: $($signature.SignerCertificate.Subject)"
          if (-not $signature.SignerCertificate -or $signature.Status -eq 'NotSigned') {
            throw 'The returned executable carries no signature'
          }
          # A test certificate has no publicly trusted root, so a rehearsal can
          # only confirm that a signature is there - the release must be valid.
          if ('${{ env.SIGNING_POLICY }}' -eq 'release-signing' -and $signature.Status -ne 'Valid') {
            throw "Signature is not valid: $($signature.StatusMessage)"
          }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload the signed EXE
        if: env.SIGNING_POLICY != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: AgentMonitorForClaude-signed
          path: ${{ steps.signed-exe.outputs.path }}
          if-no-files-found: error

      - name: Assemble the release notes
        shell: pwsh
        run: |
          # This version's CHANGELOG.md section, followed by the code signing
          # policy SignPath Foundation requires on every release page. A manual
          # run assembles them too, so a tag run is never the first attempt.
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'.TrimStart('v')
          } else {
            python -c "import agent_monitor_for_claude; print(agent_monitor_for_claude.__version__)"
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n(.*?)(?=^## \[|^\[[^\]]+\]: |\z)")
          if (-not $section.Success) {
            throw "CHANGELOG.md has no section for version $version"
          }
          $privacy = 'This program will not transfer any information to other networked systems unless specifically requested by the user or the person installing or operating it - see [PRIVACY.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/PRIVACY.md).'
          $workflow = '[release workflow](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/release.yml)'
          $footer = if ('${{ env.SIGNING_POLICY }}' -eq 'none') {
            # Nothing was signed, so the page must not claim otherwise - and it
            # should explain the publisher warning Windows will show instead.
            @(
              '## About this build',
              '',
              "This executable was built by the $workflow on a GitHub-hosted runner, straight from the source of tag ``${{ github.ref_name }}``. It is not code signed yet, so Windows will report an unknown publisher.",
              '',
              $privacy
            ) -join "`n"
          } else {
            @(
              '## Code signing policy',
              '',
              'Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).',
              '',
              "This executable was built by the $workflow on a GitHub-hosted runner, straight from the source of tag ``${{ github.ref_name }}``, and signed after manual approval. See the [code signing policy](https://github.com/${{ github.repository }}#code-signing-policy) for who reviews and approves.",
              '',
              $privacy
            ) -join "`n"
          }
          Set-Content -Path release-notes.md -Value ($section.Groups[1].Value.Trim() + "`n`n" + $footer) -Encoding utf8
          Write-Host (Get-Content release-notes.md -Raw)

      - name: Create the draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Falls back to the unsigned build when the signing steps were skipped.
        run: gh release create "${{ github.ref_name }}" "${{ steps.signed-exe.outputs.path || 'dist/AgentMonitorForClaude.exe' }}" --draft --title "${{ github.ref_name }}" --notes-file release-notes.md
